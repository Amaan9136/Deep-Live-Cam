name: ✨ Feature Request
description: Suggest an idea or improvement for this project
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The more context you give, the easier it is to
        evaluate and prioritize.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is this related to a limitation or frustration you've run into?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear, concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches or workarounds you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app does this affect?
      options:
        - Image → Image swap
        - Image → Video swap
        - Realtime webcam streaming
        - Model download / management
        - Web UI (browser)
        - Installation / setup
        - New capability entirely
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, references to similar features elsewhere, etc.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing [issues](https://github.com/Amaan9136/faceswap-live/issues) and [discussions](https://github.com/Amaan9136/faceswap-live/discussions) for this idea
          required: true
        - label: I'd be willing to help implement this
          required: false